# EMW mode policy: team defaults for how much the AI does. Owned by the team lead.
# The agent proposes the default mode for a task from the weakest skill it touches.
# Choosing a higher mode number (less human practice) than the default needs mode_reason in the task log.
version: 1
default_mode_by_level:
  M0: 1      # Human-Led / Socratic
  M1: 1
  M2: 2      # Co-Constructed / Plan-First
  M3: any
  M4: any
# Mode 4 (bounded delegation) on a skill below this level always needs a mode_reason.
mode4_min_level: M3
# After this many logged tasks touch a skill without a new A0-A2 evidence item,
# emw_check warns that a short check without AI is due (see .emw/assessments/ or Prompt 11).
assessment_every: 4
# Recall checks: days after a skill's first evidence when a short check from memory is due.
# List them with: python .emw/tools/emw_recall.py due   (see Prompt 13). Use [] to turn them off.
recall_days: [2, 7, 30]
