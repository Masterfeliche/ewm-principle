# Shared core: skills every language track reuses and the stage gate.
# Core skills are taught in the stage where they are first needed, not in a separate Stage 0.
# Validate with: python .emw/tools/emw_check.py
schema_version: 1
id: core
title: "Shared core skills"
summary: "Language-independent skills tracked once and reused by every track. Each skill is introduced in the stage that first needs it."
researched_at: "2026-11-21"
sources:
  - "docs/plans/learning-tracks-plan.md"

# A stage is passed when all of these hold. emw_check will enforce them for learners in a later step.
gate:
  - "Shipped: the stage project meets its brief, is in a repository with a README, and from Stage 2 is deployed"
  - "Levels: every skill listed for the stage is at its target level in skill-ledger.yaml"
  - "Human-verified: at least one A0-A2 evidence item for the stage has verified_by human"
  - "Rebuild: one key piece rebuilt from memory without AI, at least a week after first building it"
  - "Transfer: the stretch change in the brief done at A0 or A1"
  - "emw_check passes"

skills:
  - {id: core.terminal, name: "Terminal and editor", scope: S2, covers: "Moving around the file system, running commands, reading error output, using an editor"}
  - {id: core.git, name: "Git and GitHub", scope: S2, covers: "Commits, branches, pull requests, resolving a conflict, writing a README"}
  - {id: core.html-css, name: "HTML and basic CSS", scope: S2, covers: "Page structure, forms, links, simple layout"}
  - {id: core.http, name: "How the web works", scope: S2, covers: "Requests and responses, methods, status codes, headers, cookies, JSON"}
  - {id: core.sql, name: "SQL and relational data", scope: S2, covers: "Tables and keys, SELECT with JOIN and GROUP BY, INSERT/UPDATE/DELETE, indexes, transactions"}
  - {id: core.testing, name: "Automated testing", scope: S2, covers: "Unit and feature tests, test-first for tricky logic, test data, what not to test"}
  - {id: core.security-basics, name: "Web security basics", scope: S2, covers: "SQL injection, XSS, CSRF, password storage, secrets, least privilege"}
  - {id: core.linux-deploy, name: "Deploying to a Linux server", scope: S2, covers: "SSH, a web server, environment config, HTTPS, logs, backups"}
  - {id: core.docker, name: "Containers", scope: S2, covers: "Images, containers, compose for local services, building an app image"}
  - {id: core.ci, name: "Continuous integration", scope: S2, covers: "A pipeline that runs tests and checks on every push"}
  - {id: core.caching-queues, name: "Caching and queues", scope: S2, covers: "What to cache and for how long, invalidation, background jobs, retries, idempotency"}
  - {id: core.observability, name: "Logs, metrics and traces", scope: S2, covers: "Structured logs, key metrics, tracing a slow request, alerts"}
  - {id: core.load-testing, name: "Load testing", scope: S2, covers: "Stating a target, writing a load script, reading results, finding the bottleneck"}

stages: []
  # Stage 0 removed. Core skills are now introduced in the language track stages that need them:
  #   core.terminal, core.git         → Stage 1 (you need them to run code and save work)
  #   core.html-css, core.http, core.sql → Stage 2 (you need them to build a web app with a database)
  # The old Stage 0 lessons remain in lessons/core-stage-0/ as optional reference material.
